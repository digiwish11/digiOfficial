<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digi Wish — Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">✦</span>
      <span class="brand-text">Digi<span class="brand-accent">Wish</span></span>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark and light mode">
      <span class="theme-toggle-icon">🌙</span>
      <span class="theme-toggle-label">Dark mode</span>
    </button>
  </header>

  <!-- ============================================================
       SIGN UP CARD
      Recommendation: this form POSTs to signup.php, which
       validates the fields, hashes the password with
       password_hash(), and inserts a new row into the `users`
       table. On success it redirects back to index.html so the
       person can log in.
  ============================================================= -->
  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-card-header">
        <h1>Create your account</h1>
        <p>One account to order every wish, for every occasion.</p>
      </div>

      <div id="signupMessage" class="form-message" hidden></div>

      <form id="signupForm" action="signup.php" method="POST" novalidate>
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname" placeholder="e.g. Magilan Kumar" required autocomplete="name">

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. magilan_23" required autocomplete="username">

        <label for="gmail">Gmail address</label>
        <input type="email" id="gmail" name="gmail" placeholder="e.g. magilan@gmail.com" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6" autocomplete="new-password">

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password">

        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="index.html">Log in</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Digi Wish. Handcrafted wishes, delivered on time.</p>
  </footer>

  <script src="theme.js"></script>
  <script src="main.js"></script>
</body>
</html>
